<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>Excerpts</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="capsule" aria-hidden="true"></div>
<div id="dock">
  <div id="bar" role="dialog" aria-label="Excerpts">
    <span id="label">Saved</span>
    <textarea id="input" rows="1" spellcheck="false" placeholder="Add a thought… (#tags ok)" aria-label="My thought"></textarea>
    <div id="hint">Enter save · Esc cancel · Shift+Enter newline</div>
  </div>
</div>
<script src="overlay.js"></script>
</body>
</html>
