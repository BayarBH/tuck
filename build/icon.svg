<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tuck mark: a quote card tucked into a pocket. Source for build/icon.ico + icon.png (npm run icons). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e09a5c"/>
      <stop offset="1" stop-color="#b14f27"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c3f1b"/>
      <stop offset="1" stop-color="#7f3114"/>
    </linearGradient>
    <clipPath id="sq"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <g transform="rotate(-7 256 260)">
      <rect x="132" y="78" width="248" height="330" rx="30" fill="#fff8ef"/>
      <g fill="#b4532a">
        <g transform="translate(212 222)">
          <circle r="34"/>
          <path d="M-33 8 C-40 -48 -10 -88 34 -100 L40 -80 C12 -70 -4 -50 -2 -26 Z"/>
        </g>
        <g transform="translate(304 222)">
          <circle r="34"/>
          <path d="M-33 8 C-40 -48 -10 -88 34 -100 L40 -80 C12 -70 -4 -50 -2 -26 Z"/>
        </g>
      </g>
    </g>
    <path d="M0 318 Q256 352 512 318 V512 H0 Z" fill="url(#pocket)"/>
    <path d="M0 318 Q256 352 512 318" fill="none" stroke="#f2b07c" stroke-opacity=".55" stroke-width="8"/>
  </g>
</svg>
